# ============================================================
# 交通大数据分析系统 - 运行配置
# ------------------------------------------------------------
# 本地(Docker)模式：spark.local=true
#   模拟数据由 MockData 生成（2024-01-03 ~ 2024-01-07）
#   MySQL 使用 docker-compose 中的 mysql-traffic 容器（3306）
# 集群模式：spark.local=false
#   使用 jdbc.url.prod / jdbc.user.prod / jdbc.password.prod，
#   数据源为 Hive 表（需配置 hive.metastore.uris）
# ============================================================

jdbc.driver=com.mysql.jdbc.Driver
jdbc.datasource.size=10

# ---------- 本地(Docker)运行环境 ----------
jdbc.url=jdbc:mysql://mysql-traffic:3306/traffic?useUnicode=true&characterEncoding=UTF-8
jdbc.user=root
jdbc.password=123456

# ---------- 生产/集群运行环境 ----------
jdbc.url.prod=jdbc:mysql://mysql-traffic:3306/traffic?useUnicode=true&characterEncoding=UTF-8
jdbc.user.prod=root
jdbc.password.prod=123456

# 本地模式开关：true=本地模拟数据运行，false=集群Hive运行
spark.local=true
# 各分析模块对应的任务ID（对应 traffic 库 task 表记录）
spark.local.taskId.monitorFlow=1
spark.local.taskId.extractCar=2
spark.local.taskId.withTheCar=3
spark.local.taskid.tpn.road.flow=4
spark.local.taskid.road.one.step.convert=5

kafka.metadata.broker.list=192.168.133.131:9092,192.168.133.132:9092,192.168.133.133:9092
kafka.topics=RoadRealTimeLog
