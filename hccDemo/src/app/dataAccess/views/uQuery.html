        <div class="tiny-layout-west uQueryLeft overlay  ">

            <div class="row no-margin">

            <div class="tiny-layout-title no-margin">

                        <div class="col-md-6 col-sm-6 col-xs-6" style="padding:0px 0px 20px 0px;width:56%;"><input type="text" ng-model="carNumber" class="form-control search" id="search"></div>
                        <div class="col-md-3 col-sm-3 col-xs-3" style="padding-right:0px;width:20%;"><button type="button" class="btn" ng-click="getData(carNumber)">{{i18n.uquery_query}}</button></div>
                    </div>
                </div>

                <div class="uQueryLeftContent scrollbar" style="padding: 20px 60px; display:none;" id="routeDetails">

                            <div class="col-md-5 col-sm-5 col-xs-5 no-padding text-right">{{list.time}}</div>
                        </li>
                    </ul>
                    <p style="color:#fff">{{i18n.uquery_trip_end}}</p>
                </div>

                <div class="text-center">
                    <p class="title-text" ng-bind="plugins.text"></p>
                </div>
            </div>
        </div>
