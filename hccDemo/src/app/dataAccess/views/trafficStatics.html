<div id="leftBar" class="bigData_content">
    <div class="tiny-layout-container">
        <div id="leftMenu" class="tiny-layout-west sideList sideMenu framework-scrolling overlay">
            <ul id="leftMenuUL">
                <li>
                    <div class="row no-margin">
                        <div class="col-md-6 col-sm-6 col-xs-6 location"><span class="glyphicon glyphicon-map-marker" style="color:#2D5E73"></span>{{i18n.city}}</div>
                        <div class="col-md-6 col-sm-6 col-xs-6 time">{{warningListTable.time}}</div>
                    </div>
                    <div class="tiny-layout-title">
                        <div class="title">
                            <p class="traffic-heading" align="left">{{i18n.trafficstatistics_title}}</p>
                            <div class="row junction-name">
                                <div class="col-md-8 col-sm-8 col-xs-8 left">{{i18n.trafficstatistics_junction}}</div>
                                <div class="col-md-4 col-sm-4 col-xs-4 right">{{i18n.trafficstatistics_throughput}}</div>
                            </div>
                            <div class="table-car">
                                <ul ng-repeat="list in warningListTable.data | limitTo:10" class="mrl-5">
                                    <div ng-if="max == list.throughPut" class="row max-throughput" ng-class="{'max-throughput-red': list.level=='high','max-throughput-yellow': list.level=='medium','max-throughput-blue': list.level=='low'};" ng-if="max == list.throughPut" ng-mouseover='go(list)' ng-mouseleave='removeMarker(list)' ng-click='clickMarker(list)' style="cursor:pointer">
                                        <div class="col-md-8 col-sm-8 col-xs-8 text-left">{{list.junction}}</div>
                                        <div class="col-md-4 col-sm-4 col-xs-4 right-text">{{max}}
                                        </div>
                                    </div>
                                    <li ng-if=" max!=list.throughPut" class="row no-margin" ng-mouseover='go(list)' ng-mouseleave='removeMarker(list)' ng-click='clickMarker(list)' style="cursor:pointer">
                                        <div class="text-left col-md-6 col-sm-6 col-xs-6 no-padding">{{list.junction}}</div>
                                        <div class="right-text col-md-6 col-sm-6 col-xs-6 no-padding" ng-class="{'text-red': list.level=='high','text-yellow': list.level=='medium','text-blue': list.level=='low'}">{{list.throughPut}}</div>
                                        <div class="progress">
                                            <div ng-class="{'progress-bar-red': list.level=='high','progress-bar-yellow': list.level=='medium','progress-bar-blue': list.level=='low'};" role="progressbar" aria-valuenow="{{(list.throughPut/max)*100}}" aria-valuemin="0" aria-valuemax="100" style="width:{{(list.throughPut/max)*100}}%"></div>
                                        </div>
                                    </li>
                                </ul>
                            </div>
                        </div>
                        <div class="text-center">
                            <p class="title-text" ng-bind="plugins.text"></p>
                        </div>
                    </div>
                </li>
                <li ng-repeat="m1 in serviceList" ng-click="go(m1.state, m1.params)" ng-if="!m1.hide" style="height:44px;">
                    <span ui-sref="{{m1.state}}" class="spanleft" style="height:44px;" ng-class="{sideMenuLayoutCurrent:$state.current.name.indexOf(m1.state) !== -1 || $stateParams.origin === m1.state || $state.includes('manage.pipelineMonitor') && m1.state==='manage.pipelineList'}">
         <span class="{{m1.iconClass}} dps-icon pull-left"></span>
                    <span ng-bind="m1.title" class="common-content-title-service-catalog"></span></span>
                </li>
            </ul>
        </div>
        <div class="right-container tiny-layout-right pull-right" style="min-height: 0px">
            <div ui-view></div>
            <div id="right-btn-bar">
                <div id="zoom-in" class="glyphicon glyphicon-zoom-in"></div>
                <div id="zoom-out" class="glyphicon glyphicon-zoom-out"></div>
                <div id="hide-show" class="glyphicon glyphicon-th-list hidetable" ng-click="tableAction($event)"></div>
                <div id="search" ng-mouseover="showSearchBox()" ng-mouseleave="hideSearchBox()">
                    <div id="search-btn" style="border-bottom: 0px" class="glyphicon glyphicon-search" ng-click="clickSearch()"></div>
                    <input id="search-box" ng-keypress="keypress($event)" placeholder="{{i18n.search_content}}" ></input>
                </div>
                <div id="info-box">{{i18n.notFound}}</div>
            </div>

            <div id="myModal" class="modal">
                <!-- Modal content -->
                <div class="modal-content">
                    <span class="close" style="background-color:#0c2d4c;">&times;</span>
                    <div id="chart" style="width:100%;height:100%;padding-top:5px"></div>
                </div>
            </div>
        </div>
    </div>
