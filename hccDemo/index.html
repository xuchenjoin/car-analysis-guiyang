<body ng-click="closeMenusFavoriteError()" ng-class="'html-font-family-' + language">

    <!-- 全屏地图容器（直接放 body 下，避免 Angular 布局裁剪） -->

    <!-- 左侧面板深色背景 -->
    <div id="left-panel-bg" style="position:absolute;top:0;left:0;width:540px;height:100%;z-index:9998;background:rgba(12,34,58,0.95);pointer-events:none;"></div>
    <style>
      /* 让 #service-content 内除左侧面板外都透明 */
      #service-content, #service-content * {
        background: transparent !important;
        background-color: transparent !important;
      }
    </style>
    <script>
    // 不需要了，用 #left-panel-bg div
    </script>

    <div id="service-menus" ng-include="menus.url" class="container-fluid" style="z-index:9999;position:relative;"></div>

    <div id="service-content" style="position:relative;z-index:9999;background:transparent;">
        <div ui-view ng-animate="{enter:'fade-enter'}"></div>
        <div class="messages"></div>
        <div class="frame-cloud-messages-out framework-scrolling">
            <div class="frame-cloud-messages-in frame-small-font-size">
                <div id="frame-cloud-messages-tips">
                </div>
            </div>
        </div>
    </div>
